  - title: "feat(tx): implement isolated audit logging via Propagation.REQUIRES_NEW boundary demarcation"
    labels: ["part-1", "feat", "transaction", "propagation", "hpg-core"]
    body: |
      ## Context

      Audit records and failure metrics must survive a rolled-back business transaction.
      `Propagation.REQUIRES_NEW` suspends the outer transaction, opens an independent one,
      and commits it independently. This issue wires that boundary into `ReservationService`
      and documents the connection-pool implications.

      ## Acceptance Criteria

      - [ ] `AuditLoggerService.record(String action, String payload)` annotated `@Transactional(propagation = Propagation.REQUIRES_NEW)`
      - [ ] `AuditLoggerService.recordFailure(String reason)` also `REQUIRES_NEW`
      - [ ] `ReservationService.confirm(...)` invokes audit before the business write and again on failure
      - [ ] Integration test forces the outer transaction to roll back and asserts the audit row persists
      - [ ] Integration test asserts the audit method executes on a distinct JDBC connection by inspecting `TransactionSynchronizationManager.getCurrentTransactionName()` inside the audit method
      - [ ] Test proves a nested `REQUIRES_NEW` inside `REQUIRED` does not observe uncommitted outer writes
      - [ ] `docs/part1/propagation-boundaries.md` documents all seven propagation modes with a decision table covering when each is appropriate

      ## Technical Notes

      - `REQUIRES_NEW` acquires a second JDBC connection from the pool. Under high concurrency this doubles pool pressure. Surface this in the documentation and connect it to the HikariCP saturation issue in Part 2 (issue 24)
      - `AuditLoggerService` must be a separate bean from `ReservationService`, as established in issue 10
      - For read-only audit queries, consider `Propagation.NOT_SUPPORTED` rather than `REQUIRES_NEW`

      ## Deliverables

      - `hpg-core/src/main/java/com/engine/core/service/AuditLoggerService.java` (extended)
      - `hpg-core/src/main/java/com/engine/core/service/ReservationService.java` (updated)
      - `hpg-core/src/test/java/com/engine/core/service/PropagationBoundariesTest.java`
      - `docs/part1/propagation-boundaries.md`

      ## References

      - Blueprint: Part 1, Section 3, Propagation Boundaries
      - Depends on: issues 7, 10

  - title: "feat(web): bootstrap zero-XML DispatcherServlet via AbstractAnnotationConfigDispatcherServletInitializer"
    labels: ["part-1", "feat", "web", "servlet", "hpg-core"]
    body: |
      ## Context

      Before Spring Boot, web applications were wired through `web.xml` or a
      `WebApplicationInitializer`. This issue uses the modern, zero-XML
      `AbstractAnnotationConfigDispatcherServletInitializer` to bootstrap the
      `DispatcherServlet` programmatically and expose the servlet container lifecycle
      that Spring Boot otherwise hides.

      ## Acceptance Criteria

      - [ ] `WebAppInitializer` extends `AbstractAnnotationConfigDispatcherServletInitializer` and overrides:
        - `getRootConfigClasses()` returns `AppConfig` and `PersistenceConfig`
        - `getServletConfigClasses()` returns `WebMvcConfig`
        - `getServletMappings()` returns `"/api/*"`
      - [ ] `@EnableWebMvc` on `WebMvcConfig`. No `@EnableAutoConfiguration`
      - [ ] `InternalResourceViewResolver` configured even if only JSON is served, to prove MVC wiring
      - [ ] `MappingJackson2HttpMessageConverter` registered explicitly
      - [ ] Module packaged as WAR and deployed to Tomcat 10 or later in a documented manual step
      - [ ] `GET /api/health` returns `200 OK` with body `{"status":"UP"}`
      - [ ] `MockMvc` standalone test renders the health response without a running servlet container

      ## Technical Notes

      - Tomcat 10 and later require `jakarta.*` namespace. Align with Jakarta EE 11 pinned in issue 1
      - Do not add `spring-boot-starter-web`. The purpose is to expose manual wiring
      - Document the servlet container lifecycle in `docs/part1/dispatcher-servlet-bootstrap.md`, covering `ServletContext` initialization order and the `WebApplicationInitializer` SPI

      ## Deliverables

      - `hpg-core/src/main/java/com/engine/core/config/WebMvcConfig.java`
      - `hpg-core/src/main/java/com/engine/core/web/WebAppInitializer.java`
      - `hpg-core/src/main/java/com/engine/core/web/HealthController.java`
      - `hpg-core/src/test/java/com/engine/core/web/HealthControllerTest.java`
      - `docs/part1/dispatcher-servlet-bootstrap.md`

      ## References

      - Blueprint: Part 1, Section 4, DispatcherServlet and Web Internals
      - Depends on: issue 2

  - title: "feat(web): implement QueueSessionArgumentResolver for header extraction and queue validation"
    labels: ["part-1", "feat", "web", "resolver", "hpg-core"]
    body: |
      ## Context

      Spring MVC resolves controller method arguments through an ordered chain of
      `HandlerMethodArgumentResolver` instances. This issue adds a custom resolver that
      extracts `X-Queue-Session` from the request header, validates its shape, and injects
      it as a strongly typed parameter. This is the blueprint's `QueueSessionArgumentResolver`
      and the pure-Spring precursor to the Part 3 JWT filter.

      ## Acceptance Criteria

      - [ ] Record `QueueSession(String sessionId, Instant issuedAt, String seatBucket)` in `com.engine.core.web`
      - [ ] Parameter-level annotation `@QueueSessionHeader` with `@Target(ElementType.PARAMETER)` and `@Retention(RetentionPolicy.RUNTIME)`
      - [ ] `QueueSessionArgumentResolver` implements `HandlerMethodArgumentResolver`:
        - `supportsParameter` returns true only when the parameter carries `@QueueSessionHeader` and its type is `QueueSession`
        - `resolveArgument` reads `X-Queue-Session`, decodes it, and validates required claims
        - Missing header raises `MissingRequestHeaderException`
        - Malformed header raises a custom `InvalidQueueSessionException` that maps to `400 Bad Request`
      - [ ] Registered in `WebMvcConfig#addArgumentResolvers`
      - [ ] Controller method:
        ```java
        @GetMapping("/api/seat-map")
        public SeatMap seatMap(@QueueSessionHeader QueueSession session) { ... }
        ```
      - [ ] Test verifies a valid header resolves to a populated `QueueSession`
      - [ ] Test verifies a missing header produces `400 Bad Request`
      - [ ] Test verifies a malformed header produces `400 Bad Request` with a descriptive body
      - [ ] `docs/part1/custom-argument-resolvers.md` documents the resolver chain order and where custom resolvers are inserted

      ## Technical Notes

      - Custom resolvers registered via `addArgumentResolvers` are appended after built-in resolvers. Verify precedence when a parameter could be resolved by multiple resolvers
      - Do not read the header inside the controller method. The resolver is the sole extraction point
      - The header encoding format should be documented in the resolver's Javadoc, including the exact claim names expected

      ## Deliverables

      - `hpg-core/src/main/java/com/engine/core/web/QueueSession.java`
      - `hpg-core/src/main/java/com/engine/core/web/QueueSessionHeader.java`
      - `hpg-core/src/main/java/com/engine/core/web/QueueSessionArgumentResolver.java`
      - `hpg-core/src/main/java/com/engine/core/web/InvalidQueueSessionException.java`
      - `hpg-core/src/main/java/com/engine/core/web/SeatMapController.java`
      - `hpg-core/src/test/java/com/engine/core/web/QueueSessionArgumentResolverTest.java`
      - `docs/part1/custom-argument-resolvers.md`

      ## References

      - Blueprint: Part 1, Section 4, DispatcherServlet and Web Internals
      - Depends on: issue 12

  - title: "docs: document pure spring architecture, proxy boundaries, and transaction lifecycle findings"
    labels: ["part-1", "docs", "hpg-core"]
    body: |
      ## Context

      Part 1 has produced numerous under-the-hood findings: container lifecycle semantics,
      proxy generation mechanics, transaction demarcation behavior, and MVC wiring. This
      issue consolidates them into a single architecture document that serves as the
      reference for Parts 2 and 3, and as the portfolio artifact for this milestone.

      ## Acceptance Criteria

      - [ ] `docs/part1/README.md` published and serves as the milestone landing page
      - [ ] Each of the following documents exists and is linked from the README:
        - `beanfactory-vs-context.md` (from issue 3)
        - `circular-dependency-analysis.md` (from issue 5)
        - `proxy-mechanics.md` (from issue 9)
        - `self-invocation-trap.md` (from issue 10)
        - `propagation-boundaries.md` (from issue 11)
        - `dispatcher-servlet-bootstrap.md` (from issue 12)
        - `custom-argument-resolvers.md` (from issue 13)
      - [ ] A `container-lifecycle.md` document is added, covering:
        - `BeanFactory` versus `ApplicationContext` initialization order
        - `BeanPostProcessor` invocation points relative to `@PostConstruct` and `InitializingBean`
        - Bean scope lifetimes and destruction callbacks
      - [ ] A `transaction-lifecycle.md` document is added, covering:
        - The interaction between `@Transactional` and the AOP proxy chain
        - Aspect ordering rules and the wrapping hierarchy
        - Common failure modes with reproduction references to the corresponding tests
      - [ ] The milestone README contains a diagram (Mermaid or ASCII) illustrating the container, proxy, and transaction layers
      - [ ] Every document lists the related GitHub issue number at the top

      ## Technical Notes

      - Prefer Mermaid diagrams embedded in Markdown. GitHub renders them natively without additional tooling
      - Each document should be self-contained. A reader should be able to understand the topic without navigating to other files
      - Cross-link aggressively. Part 1 findings will be referenced repeatedly in Parts 2 and 3

      ## Deliverables

      - `docs/part1/README.md`
      - `docs/part1/container-lifecycle.md`
      - `docs/part1/transaction-lifecycle.md`
      - Cross-links and content finalized in the seven documents listed above

      ## References

      - Blueprint: Part 1, all sections
      - Depends on: issues 3, 5, 9, 10, 11, 12, 13