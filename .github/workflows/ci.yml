name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and verify (unit tests)
        run: mvn -B -q clean verify -DskipITs

      - name: Enforce no Spring Boot in hpg-core
        run: |
          OUTPUT=$(mvn -B -q dependency:tree "-Dincludes=org.springframework.boot" || true)
          if echo "$OUTPUT" | grep -q "org.springframework.boot"; then
            echo "FAIL: hpg-core depends on Spring Boot. This violates the Part 1 contract."
            echo "$OUTPUT"
            exit 1
          fi
          echo "OK: hpg-core is free of Spring Boot dependencies."

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  integration:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Docker is available
        run: docker info

      - name: Run integration tests
        run: mvn -B -q failsafe:integration-test failsafe:verify

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/**'
          if-no-files-found: ignore